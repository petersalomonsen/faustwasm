name: Verify asc backend (no patch) + compare to @psalomo

# Proves that faust PR #1261 (AS_BACKEND += WASM, committed in faust SOURCE)
# is sufficient on its own to build an asc-enabled libfaust-wasm — NO sed patch
# here — and that its `-lang asc` output matches the published @psalomo binary
# the WebAssembly Music webapp currently runs on. Uploads the built binary.

on:
  workflow_dispatch:
  push:
    branches: ['verify/**']

permissions:
  contents: read

env:
  FAUST_REPO: petersalomonsen/faust
  FAUST_REF: asc-wasm-backend          # PR #1261 branch: master-dev + the one-liner, NO other patch
  PSALOMO_VERSION: 0.16.1-asc.0        # the binary the webapp consumes today

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out faustwasm
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pin CMake (3.31+ emits link-time --dependency-file= which emcc rejects)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.6'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Check out Faust (PR #1261 branch — asc enabled in source, no patch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FAUST_REPO }}
          ref: ${{ env.FAUST_REF }}
          path: faust
          submodules: recursive

      - name: Confirm AS_BACKEND already has WASM in source (no patch applied)
        run: |
          echo "AS_BACKEND line in faust source:"
          grep -n 'AS_BACKEND' faust/build/backends/regular.cmake
          grep -qE '^set \( AS_BACKEND .*\bWASM\b' faust/build/backends/regular.cmake \
            || { echo "::error::AS_BACKEND lacks WASM in source — the one-liner is not present"; exit 1; }

      - name: Build libfaust-wasm (no sed patch)
        working-directory: faust/build
        run: |
          make cmake BACKENDS=regular.cmake
          find faustdir/emcc -type f \( -name 'link.txt' -o -name 'build.make' \) \
            -exec sed -i 's| --dependency-file=[^ ]*||g' {} +
          make wasmlib JOBS=-j$(nproc)
          ls -la lib/libfaust-wasm.*

      - name: Stage built libfaust-wasm + build the wrapper
        run: |
          cp faust/build/lib/libfaust-wasm.js   libfaust-wasm/libfaust-wasm.js
          cp faust/build/lib/libfaust-wasm.wasm libfaust-wasm/libfaust-wasm.wasm
          cp faust/build/lib/libfaust-wasm.data libfaust-wasm/libfaust-wasm.data
          npm ci
          npm run build-cjs
          npm run build-esm
          npm run build-types

      - name: Get the webapp DSP corpus + the published @psalomo package
        run: |
          # the webapp's real DSPs
          git clone --depth 1 https://github.com/petersalomonsen/javascriptmusic jm
          mkdir -p corpus
          cp jm/examples/dx7/dsp/*.dsp corpus/ 2>/dev/null || true
          cp jm/examples/master_me/dsp/*.dsp corpus/ 2>/dev/null || true
          # the published binary the webapp consumes today
          npm pack @psalomo/faustwasm@${PSALOMO_VERSION}
          tar xzf psalomo-faustwasm-*.tgz
          ls corpus

      - name: Transpile every webapp DSP with BOTH binaries and compare asc output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'fs';
          import path from 'path';
          // Fresh module+compiler per call: an emscripten abort() (e.g. a Faust
          // compile error) poisons its module instance, so we must not share one
          // across DSPs. This also mirrors how the webapp/CLI use it per run.
          const make = async (pkgDir, src, name) => {
            const m = await import(path.resolve(pkgDir, 'dist/esm/index.js'));
            const mod = await m.instantiateFaustModuleFromFile(path.resolve(pkgDir, 'libfaust-wasm/libfaust-wasm.js'));
            const c = new m.FaustCompiler(new m.LibFaust(mod));
            const ver = c.version();
            try {
              const out = '/' + name + '.ts';
              const ok = c.generateAuxFiles(name, src, `-lang asc -cn ${name} -o ${out}`);
              if (!ok) return { ver, ok:false, err: (c.getErrorMessage()||'').trim() };
              return { ver, ok:true, ts: mod.FS.readFile(out, { encoding:'utf8' }) };
            } catch (e) { return { ver, ok:false, err: 'abort: ' + (e && e.message || e) }; }
          };
          const dir = 'corpus';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.dsp')).sort();
          let regress=0, same=0, diff=0, bothfail=0; let builtVer='?', psalVer='?';
          for (const f of files) {
            const name = f.replace(/[^A-Za-z0-9]/g,'_').replace(/_dsp$/,'');
            const src = fs.readFileSync(path.join(dir,f),'utf8');
            const a = await make('.', src, name);            // freshly built (PR #1261, no patch)
            const b = await make('package', src, name);      // published @psalomo
            builtVer=a.ver; psalVer=b.ver;
            if (a.ok && a.ts.includes('export class')) {
              if (b.ok && a.ts === b.ts) { console.log(`SAME   ${f}  ${a.ts.length}B`); same++; }
              else if (b.ok)            { console.log(`DIFF   ${f}  built=${a.ts.length}B psalomo=${b.ts.length}B (valid, version delta)`); diff++; }
              else                      { console.log(`OK-NEW ${f}  built=${a.ts.length}B (@psalomo failed: ${b.err})`); diff++; }
            } else if (!b.ok) {
              console.log(`SKIP   ${f}  both fail (corpus import issue, not a backend regression): ${a.err}`); bothfail++;
            } else {
              console.log(`REGRESS ${f}  built FAILED but @psalomo OK: ${a.err}`); regress++;
            }
          }
          console.log(`\nbuilt faust ${builtVer} | @psalomo faust ${psalVer}`);
          console.log(`SUMMARY ${files.length} DSPs | same=${same} diff=${diff} skip(bothfail)=${bothfail} REGRESS=${regress}`);
          if (regress>0) { console.error('::error::built binary regressed vs @psalomo on some webapp DSPs'); process.exit(1); }
          if (same+diff===0) { console.error('::error::built binary produced no valid asc for any DSP'); process.exit(1); }
          NODE

      - name: Upload built libfaust-wasm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libfaust-wasm-asc-from-source
          path: |
            libfaust-wasm/libfaust-wasm.js
            libfaust-wasm/libfaust-wasm.wasm
            libfaust-wasm/libfaust-wasm.data
